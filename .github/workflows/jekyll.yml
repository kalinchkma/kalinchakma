# Builds the site and deploys it to GitHub Pages.
#
# - Push to main     → build + deploy
# - Pull request     → build only (a check that the site still compiles)
# - Manual           → Actions → "Deploy Jekyll site to Pages" → Run workflow
#
# Requires: Settings → Pages → Build and deployment → Source = "GitHub Actions".
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel a deploy that's already running.
concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3" # latest 3.3.x on the runner; Gemfile.lock uses Bundler 4, which needs Ruby >= 3.2
          bundler-cache: true # runs 'bundle install' and caches gems
          cache-version: 0 # bump to force a fresh gem download

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick   # responsive images (imagemagick.enabled in _config.yml)
          pip3 install --upgrade nbconvert                              # Jupyter posts (optional)
          npm ci
          npm install -g purgecss

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        # base_path comes from the repo name (/kalinchakma now, empty if renamed to kalinchkma.github.io)
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Purge unused CSS
        run: purgecss -c purgecss.config.js

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
